<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin - WheelSense CMS</title>
    <link rel="stylesheet" href="/src/styles/global.css" />
    <link rel="stylesheet" href="/src/styles/components.css" />
    <style>
        .admin-shell {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .admin-auth {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-lg);
        }

        .admin-auth__card {
            width: 100%;
            max-width: 540px;
            padding: var(--space-xl);
        }

        .admin-auth__title {
            font-family: var(--font-display);
            font-size: var(--text-h2);
            margin-bottom: var(--space-sm);
            text-align: center;
        }

        .admin-auth__subtitle {
            text-align: center;
            color: var(--color-text-secondary);
            margin-bottom: var(--space-lg);
        }

        .admin-auth__help {
            margin-top: var(--space-md);
            font-size: var(--text-small);
            color: var(--color-text-tertiary);
            line-height: var(--leading-relaxed);
        }

        .admin-app {
            display: none;
            min-height: 100vh;
            grid-template-columns: minmax(320px, 420px) 1fr;
        }

        .admin-app.is-visible {
            display: grid;
        }

        .admin-panel {
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            background: var(--color-bg-elevated);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .admin-panel__header {
            padding: var(--space-lg);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .admin-panel__title {
            font-family: var(--font-display);
            font-size: var(--text-h4);
            margin-bottom: 0.35rem;
        }

        .admin-panel__subtitle {
            font-size: var(--text-small);
            color: var(--color-text-tertiary);
        }

        .admin-controls {
            padding: var(--space-md) var(--space-lg);
            display: grid;
            gap: 0.7rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .admin-control-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.55rem;
        }

        .admin-select,
        .admin-input,
        .admin-textarea {
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.02);
            color: var(--color-text-primary);
            border-radius: var(--radius-sm);
            padding: 0.65rem 0.75rem;
            font-size: var(--text-small);
        }

        .admin-select:focus,
        .admin-input:focus,
        .admin-textarea:focus {
            border-color: rgba(255, 255, 255, 0.4);
            outline: none;
        }

        .admin-fields {
            flex: 1;
            overflow-y: auto;
            padding: var(--space-md) var(--space-lg) var(--space-lg);
            display: grid;
            gap: 0.75rem;
        }

        .admin-field {
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-sm);
            padding: 0.65rem;
            background: rgba(255, 255, 255, 0.02);
        }

        .admin-field__label {
            font-size: var(--text-caption);
            color: var(--color-text-tertiary);
            letter-spacing: var(--tracking-wide);
            text-transform: uppercase;
            margin-bottom: 0.35rem;
        }

        .admin-panel__footer {
            padding: var(--space-md) var(--space-lg) var(--space-lg);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: grid;
            gap: 0.55rem;
        }

        .admin-status {
            font-size: var(--text-small);
            color: var(--color-text-tertiary);
            min-height: 1.2rem;
        }

        .admin-status.is-error {
            color: #f87171;
        }

        .admin-status.is-success {
            color: #34d399;
        }

        .admin-preview {
            position: relative;
            background: #0a0c12;
            min-height: 100vh;
        }

        .admin-preview__bar {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--space-lg);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.35);
        }

        .admin-preview__label {
            font-size: var(--text-small);
            color: var(--color-text-tertiary);
            letter-spacing: var(--tracking-wide);
            text-transform: uppercase;
        }

        .admin-preview__frame {
            width: 100%;
            height: calc(100vh - 56px);
            border: 0;
            background: #05060a;
        }

        .btn-compact {
            padding: 0.55rem 0.75rem;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.03);
            color: var(--color-text-secondary);
            font-size: var(--text-small);
            transition: all var(--duration-fast);
        }

        .btn-compact:hover {
            color: var(--color-text-primary);
            border-color: rgba(255, 255, 255, 0.35);
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-compact.btn-danger {
            border-color: rgba(248, 113, 113, 0.5);
            color: #fca5a5;
        }

        .btn-compact.btn-danger:hover {
            border-color: rgba(248, 113, 113, 0.8);
            color: #fecaca;
            background: rgba(248, 113, 113, 0.1);
        }

        @media (max-width: 1024px) {
            .admin-app.is-visible {
                grid-template-columns: 1fr;
            }

            .admin-panel {
                min-height: auto;
            }

            .admin-preview__frame {
                height: 68vh;
            }
        }
    </style>
</head>

<body>
    <main class="admin-shell">
        <section class="admin-auth" id="authView">
            <div class="glass-card admin-auth__card">
                <h1 class="admin-auth__title">WheelSense CMS</h1>
                <p class="admin-auth__subtitle">Sign in with your admin token to edit production content on Vercel.</p>
                <form id="tokenForm">
                    <div class="form-group">
                        <label class="form-label" for="adminToken">Admin Token</label>
                        <input class="admin-input" id="adminToken" type="password" placeholder="Enter ADMIN_MODE_TOKEN" required />
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Enter Admin Mode</button>
                </form>
                <p class="admin-auth__help">Required environment variables on Vercel: <code>ADMIN_MODE_TOKEN</code>,
                    <code>UPSTASH_REDIS_REST_URL</code>, and <code>UPSTASH_REDIS_REST_TOKEN</code>.
                </p>
                <p class="admin-auth__help" id="authStatus"></p>
            </div>
        </section>

        <section class="admin-app" id="editorView">
            <aside class="admin-panel">
                <header class="admin-panel__header">
                    <h2 class="admin-panel__title">Content Editor</h2>
                    <p class="admin-panel__subtitle" id="editorPageSubtitle">Select a page to edit.</p>
                </header>

                <div class="admin-controls">
                    <label class="form-label" for="pageSelector">Page</label>
                    <select class="admin-select" id="pageSelector"></select>
                    <div class="admin-control-row">
                        <button class="btn-compact" id="reloadPageBtn" type="button">Reload Fields</button>
                        <button class="btn-compact" id="openPageBtn" type="button">Open Live Page</button>
                    </div>
                </div>

                <form class="admin-fields" id="fieldEditor"></form>

                <footer class="admin-panel__footer">
                    <div class="admin-control-row">
                        <button class="btn-compact btn-danger" id="resetPageBtn" type="button">Reset Page</button>
                        <button class="btn-compact" id="logoutBtn" type="button">Log Out</button>
                    </div>
                    <button class="btn btn-primary" id="saveBtn" type="button">Save Changes</button>
                    <p class="admin-status" id="adminStatus"></p>
                </footer>
            </aside>

            <section class="admin-preview">
                <div class="admin-preview__bar">
                    <span class="admin-preview__label">Live Preview</span>
                    <span class="admin-preview__label" id="previewUrl"></span>
                </div>
                <iframe class="admin-preview__frame" id="pagePreview" title="CMS Preview" src="about:blank"></iframe>
            </section>
        </section>
    </main>

    <script type="module" src="/src/pages/admin.js"></script>
</body>

</html>
