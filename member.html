<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="WheelSense team member profile and full CV" />
    <title>Member Profile - WheelSense</title>
    <link rel="stylesheet" href="/src/styles/global.css" />
    <link rel="stylesheet" href="/src/styles/components.css" />
    <style>
        .member-hero {
            min-height: 52vh;
            display: flex;
            align-items: flex-end;
            padding: var(--space-3xl) 0 var(--space-lg);
            position: relative;
            overflow: hidden;
        }

        .member-hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 12% 26%, rgba(56, 189, 248, 0.24), transparent 42%),
                radial-gradient(circle at 88% 14%, rgba(16, 185, 129, 0.14), transparent 40%),
                radial-gradient(circle at 50% 88%, rgba(99, 102, 241, 0.16), transparent 45%);
            pointer-events: none;
            z-index: 0;
        }

        .member-hero .container {
            position: relative;
            z-index: 1;
        }

        .member-hero__layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 220px;
            gap: var(--space-lg);
            align-items: end;
        }

        .member-hero__badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.3rem 0.8rem;
            border-radius: var(--radius-full);
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(255, 255, 255, 0.04);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: var(--tracking-wide);
            color: var(--color-text-tertiary);
            margin-bottom: var(--space-sm);
        }

        .member-hero__title {
            font-family: var(--font-display);
            font-size: clamp(2rem, 5.5vw, 4.4rem);
            line-height: var(--leading-tight);
            margin-bottom: 0.4rem;
        }

        .member-hero__subtitle {
            color: var(--color-text-secondary);
            font-size: var(--text-body-lg);
            margin-bottom: 0.5rem;
            max-width: 900px;
        }

        .member-hero__meta {
            color: var(--color-text-tertiary);
            max-width: 820px;
            line-height: var(--leading-relaxed);
        }

        .member-hero__portrait {
            width: 220px;
            aspect-ratio: 4 / 5;
            border-radius: var(--radius-xl);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: linear-gradient(160deg, rgba(14, 18, 28, 0.88), rgba(8, 10, 18, 0.98));
            box-shadow: 0 20px 52px rgba(0, 0, 0, 0.36);
        }

        .member-hero__portrait-img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            object-position: center 12%;
            transition: opacity var(--duration-normal) var(--ease-out-quart);
        }

        .member-hero__portrait-img.is-hidden {
            opacity: 0;
        }

        .member-shell {
            display: grid;
            grid-template-columns: minmax(260px, 320px) minmax(0, 1fr);
            gap: var(--space-md);
        }

        .member-summary {
            position: sticky;
            top: 92px;
            align-self: start;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-xl);
            padding: var(--space-md);
            background:
                linear-gradient(165deg, rgba(10, 14, 24, 0.95), rgba(8, 10, 16, 0.94)),
                radial-gradient(circle at 88% 12%, rgba(125, 211, 252, 0.2), transparent 48%);
            box-shadow: 0 26px 65px rgba(0, 0, 0, 0.35);
            display: grid;
            gap: 0.9rem;
        }

        .member-summary__photo {
            width: 100%;
            aspect-ratio: 4 / 5;
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: linear-gradient(145deg, rgba(24, 33, 56, 0.95), rgba(9, 13, 22, 0.95));
        }

        .member-summary__photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 14%;
        }

        .member-summary__name {
            font-family: var(--font-display);
            font-size: 1.35rem;
            line-height: 1.25;
        }

        .member-summary__thai-name {
            color: var(--color-text-tertiary);
            font-size: var(--text-small);
            line-height: 1.4;
            margin-top: -0.2rem;
        }

        .member-summary__role {
            color: var(--color-text-secondary);
            font-size: var(--text-small);
            line-height: 1.5;
        }

        .member-summary__chips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.45rem;
        }

        .member-summary__chip {
            font-size: 0.68rem;
            letter-spacing: var(--tracking-wide);
            text-transform: uppercase;
            color: var(--color-text-tertiary);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: var(--radius-full);
            padding: 0.3rem 0.7rem;
            background: rgba(255, 255, 255, 0.03);
        }

        .member-summary__meta {
            display: grid;
            gap: 0.45rem;
            margin-top: 0.25rem;
        }

        .member-summary__meta-row {
            display: grid;
            gap: 0.15rem;
            padding: 0.45rem 0.55rem;
            border-radius: var(--radius-md);
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.02);
        }

        .member-summary__meta-label {
            font-size: 0.64rem;
            letter-spacing: var(--tracking-wide);
            text-transform: uppercase;
            color: var(--color-text-muted);
        }

        .member-summary__meta-value {
            font-size: var(--text-small);
            color: var(--color-text-secondary);
            line-height: 1.45;
            word-break: break-word;
        }

        .member-summary__actions {
            display: flex;
            gap: 0.55rem;
            flex-wrap: wrap;
        }

        .member-summary__button {
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: var(--radius-full);
            padding: 0.42rem 0.9rem;
            font-size: var(--text-caption);
            letter-spacing: var(--tracking-wide);
            text-transform: uppercase;
            color: var(--color-text-secondary);
            transition: all var(--duration-fast) var(--ease-out-quart);
        }

        .member-summary__button:hover {
            color: var(--color-text-primary);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.24);
        }

        .member-accordion {
            display: grid;
            gap: 0.75rem;
        }

        .member-accordion__item {
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-lg);
            background:
                linear-gradient(165deg, rgba(12, 15, 24, 0.95), rgba(8, 10, 15, 0.94));
            overflow: hidden;
        }

        .member-accordion__item summary {
            list-style: none;
            cursor: pointer;
            padding: 0.9rem 1rem;
            font-size: var(--text-small);
            letter-spacing: var(--tracking-wide);
            text-transform: uppercase;
            color: var(--color-text-tertiary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .member-accordion__item summary::-webkit-details-marker {
            display: none;
        }

        .member-accordion__body {
            padding: 0.95rem 1rem 1rem;
            display: grid;
            gap: 0.75rem;
        }

        .member-accordion__text {
            color: var(--color-text-secondary);
            line-height: var(--leading-relaxed);
        }

        .member-grid {
            display: grid;
            gap: 0.65rem;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .profile-meta-item {
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-md);
            padding: 0.65rem 0.72rem;
            background: rgba(255, 255, 255, 0.02);
        }

        .profile-meta-item__label {
            font-size: 0.63rem;
            text-transform: uppercase;
            letter-spacing: var(--tracking-wide);
            color: var(--color-text-muted);
            margin-bottom: 0.18rem;
        }

        .profile-meta-item__value {
            font-size: var(--text-small);
            color: var(--color-text-secondary);
            line-height: 1.4;
            word-break: break-word;
        }

        .skill-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .skill-tag {
            font-size: 0.72rem;
            padding: 0.3rem 0.8rem;
            border-radius: var(--radius-full);
            border: 1px solid rgba(255, 255, 255, 0.11);
            color: var(--color-text-secondary);
            background: rgba(255, 255, 255, 0.03);
        }

        .compact-list {
            margin: 0;
            padding-left: 1rem;
            list-style: disc;
            display: grid;
            gap: 0.36rem;
            color: var(--color-text-secondary);
            font-size: var(--text-small);
            line-height: 1.5;
        }

        .cv-entry-grid {
            display: grid;
            gap: 0.6rem;
        }

        .cv-entry {
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-md);
            padding: 0.72rem;
            background: rgba(255, 255, 255, 0.02);
            display: grid;
            gap: 0.35rem;
        }

        .cv-entry__title {
            font-family: var(--font-display);
            font-size: var(--text-body);
        }

        .cv-entry__meta {
            font-size: var(--text-small);
            color: var(--color-text-tertiary);
            line-height: 1.4;
        }

        .skills-grid {
            display: grid;
            gap: 0.55rem;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .skills-grid__item {
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-md);
            background: rgba(255, 255, 255, 0.02);
            padding: 0.65rem 0.7rem;
        }

        .skills-grid__label {
            font-size: 0.62rem;
            letter-spacing: var(--tracking-wide);
            text-transform: uppercase;
            color: var(--color-text-muted);
            margin-bottom: 0.2rem;
        }

        .skills-grid__value {
            font-size: var(--text-small);
            line-height: 1.4;
            color: var(--color-text-secondary);
        }

        @media (max-width: 1024px) {
            .member-shell {
                grid-template-columns: 1fr;
            }

            .member-summary {
                position: static;
            }
        }

        @media (max-width: 900px) {
            .member-grid,
            .skills-grid {
                grid-template-columns: 1fr;
            }

            .member-hero__layout {
                grid-template-columns: 1fr;
            }

            .member-hero__portrait {
                width: 180px;
            }
        }
    </style>
</head>

<body>
    <div class="loader" id="loader">
        <div class="loader__spinner"></div>
    </div>

    <main id="main">
        <section class="member-hero section-full">
            <div class="container">
                <div class="member-hero__layout reveal">
                    <div>
                        <p class="member-hero__badge">Member Profile</p>
                        <h1 class="member-hero__title" id="memberName">Member Profile</h1>
                        <p class="member-hero__subtitle" id="memberRole">WheelSense Team</p>
                        <p class="member-hero__meta" id="memberSubtitle">Compact profile view with expandable full details.</p>
                    </div>
                    <figure class="member-hero__portrait">
                        <img class="member-hero__portrait-img is-hidden" id="memberHeroPhoto" alt="Member portrait" loading="lazy" />
                    </figure>
                </div>
            </div>
        </section>

        <section class="section" style="padding-top: var(--space-xl);">
            <div class="container container-wide" id="memberProfile"></div>
        </section>
    </main>

    <script type="module" src="/src/pages/member.ts"></script>
</body>

</html>
