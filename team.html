<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="Meet the WheelSense team: student researchers and academic advisors behind the assistive innovation program." />
    <title>Team - WheelSense</title>
    <link rel="stylesheet" href="/src/styles/global.css" />
    <link rel="stylesheet" href="/src/styles/components.css" />
    <style>
        .team-hero {
            min-height: 50vh;
            display: flex;
            align-items: flex-end;
            padding-bottom: var(--space-3xl);
        }

        .team-page-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--space-lg);
        }

        .team-profile {
            position: relative;
            border-radius: var(--radius-lg);
            overflow: hidden;
            background: var(--color-bg-card);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all var(--duration-normal) var(--ease-out-quart);
            cursor: pointer;
        }

        .team-profile:hover {
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-6px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
        }

        .team-profile__image {
            width: 100%;
            aspect-ratio: 4/5;
            background: var(--color-bg-elevated);
            position: relative;
            overflow: hidden;
        }

        .team-profile__image-gradient {
            position: absolute;
            inset: 0;
            opacity: 0.45;
        }

        .team-profile__info {
            padding: var(--space-lg);
        }

        .team-profile__name {
            font-family: var(--font-display);
            font-size: 1.08rem;
            font-weight: 600;
            margin-bottom: 6px;
            line-height: 1.35;
        }

        .team-profile__role {
            font-size: var(--text-small);
            color: var(--color-text-tertiary);
            letter-spacing: var(--tracking-wide);
            margin-bottom: 0.55rem;
            line-height: 1.4;
        }

        .team-profile__subtitle {
            font-size: var(--text-small);
            color: var(--color-text-secondary);
            line-height: 1.5;
        }

        .profile-detail {
            display: none;
            position: fixed;
            inset: 0;
            z-index: var(--z-modal);
            background: var(--color-bg);
            overflow-y: auto;
        }

        .profile-detail.is-open {
            display: block;
        }

        .profile-detail__close {
            position: fixed;
            top: var(--space-md);
            right: var(--space-md);
            z-index: 301;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            color: var(--color-text-secondary);
            transition: all var(--duration-fast);
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .profile-detail__close:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--color-text-primary);
        }

        .profile-detail__hero {
            display: flex;
            gap: var(--space-3xl);
            padding: var(--space-4xl) 0 var(--space-2xl);
            align-items: center;
        }

        .profile-detail__portrait {
            width: 300px;
            height: 400px;
            border-radius: var(--radius-lg);
            background: var(--color-bg-elevated);
            flex-shrink: 0;
            overflow: hidden;
        }

        .profile-detail__header h1 {
            font-family: var(--font-display);
            font-size: var(--text-h1);
            margin-bottom: var(--space-xs);
            line-height: 1.2;
        }

        .profile-detail__header p {
            font-size: var(--text-body-lg);
            color: var(--color-text-secondary);
            margin-bottom: var(--space-sm);
        }

        .profile-detail__thai-name {
            font-size: var(--text-body);
            color: var(--color-text-tertiary);
        }

        .profile-detail__section {
            padding: var(--space-xl) 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .profile-detail__section:last-child {
            border-bottom: none;
        }

        .profile-detail__section-label {
            font-size: var(--text-caption);
            font-weight: 500;
            color: var(--color-text-tertiary);
            letter-spacing: var(--tracking-wider);
            text-transform: uppercase;
            margin-bottom: var(--space-md);
        }

        .profile-meta-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(200px, 1fr));
            gap: 0.85rem;
        }

        .profile-meta-item {
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-md);
            padding: 0.7rem 0.8rem;
            background: rgba(255, 255, 255, 0.02);
        }

        .profile-meta-item__label {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: var(--tracking-wide);
            color: var(--color-text-muted);
            margin-bottom: 0.2rem;
        }

        .profile-meta-item__value {
            font-size: 0.88rem;
            color: var(--color-text-secondary);
            line-height: 1.4;
        }

        .skill-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .skill-tag {
            font-size: var(--text-small);
            padding: 6px 16px;
            border-radius: var(--radius-full);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--color-text-secondary);
        }

        .profile-education-list {
            display: grid;
            gap: 0.6rem;
        }

        .profile-education-list__item {
            color: var(--color-text-secondary);
            line-height: 1.5;
            font-size: var(--text-small);
            padding: 0.5rem 0.7rem;
            border-left: 2px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.02);
        }

        @media (max-width: 1024px) {
            .team-page-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .profile-meta-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .team-page-grid {
                grid-template-columns: 1fr;
            }

            .profile-detail__hero {
                flex-direction: column;
                padding-top: var(--space-3xl);
                gap: var(--space-lg);
            }

            .profile-detail__portrait {
                width: 200px;
                height: 260px;
            }

            .profile-detail__header h1 {
                font-size: var(--text-h2);
            }
        }
    </style>
</head>

<body>
    <div class="loader" id="loader">
        <div class="loader__spinner"></div>
    </div>

    <main id="main">
        <section class="team-hero section-full">
            <div class="container" style="text-align: center; width: 100%;">
                <div class="reveal">
                    <p class="text-small text-tertiary"
                        style="letter-spacing: var(--tracking-wider); text-transform: uppercase; margin-bottom: var(--space-sm);">
                        The Collective</p>
                    <h1 class="h1" style="margin-bottom: var(--space-md);">WheelSense Team</h1>
                    <p class="text-body-lg text-secondary" style="max-width: 640px; margin: 0 auto;">Student researchers and
                        academic advisors collaborating across engineering and allied health sciences.</p>
                </div>
            </div>
        </section>

        <section class="section">
            <div class="container container-wide">
                <div class="team-page-grid stagger-children" id="teamPageGrid"></div>
            </div>
        </section>
    </main>

    <div class="profile-detail" id="profileDetail">
        <button class="profile-detail__close" id="profileDetailClose">&times;</button>
        <div id="profileDetailContent"></div>
    </div>

    <script type="module" src="/src/pages/team.js"></script>
</body>

</html>
